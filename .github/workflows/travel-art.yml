name: Travel art and store screenshots

# Manual (or on push to chore/travel-art): pulls the Higgsfield postcard art,
# regenerates the App Store preview set against it, and commits both back.
on:
  workflow_dispatch:
  push:
    branches: [chore/travel-art]

permissions:
  contents: write

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Fetch travel postcard art
        run: node scripts/fetch-travel-art.js
      - name: Build web bundle (syncs img/ into www/)
        run: npm run build
      - name: Regenerate App Store previews
        env:
          BROWSER_PATH: /usr/bin/google-chrome
        run: node scripts/capture-screenshots.js
      - name: Commit
        run: |
          git config user.name "Noor"
          git config user.email "noorie10@yahoo.com"
          git add img www/img screenshots/store-preview-v16
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "chore: add travel postcard art and final 1.9 store previews"
          git push
